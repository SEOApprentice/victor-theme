  <text x="330" y="396" font-family="Space Grotesk, sans-serif" font-size="40" fill="#F2B134">&#9733;</text>

  <rect x="60" y="486" width="1080" height="54" rx="10" fill="rgba(22,163,148,0.1)" stroke="#16A394" stroke-width="1.5"/>
