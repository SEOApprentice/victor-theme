    .heading { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #FFFFFF; }
    .proof { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; fill: #16A394; }
  </style>

  <rect width="1200" height="630" fill="#101E38"/>

